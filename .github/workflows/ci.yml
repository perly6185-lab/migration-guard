name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - "20"
          - "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Setup pnpm for workspace smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm install --global pnpm@9

      - name: Test
        run: npm test

      - name: ZBoss batch-update L4-C orchestration self-test
        run: npm run batch-rust:l4c-ci

      - name: VMP offline gate
        run: npm run vmp:gate

      - name: Semantic rule package gate
        run: npm run semantic:gate

      - name: UI smoke
        run: npm run ui:smoke

      - name: Diff check
        run: git diff --check

      - name: Production dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --omit=dev --audit-level=high

      - name: Package content audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run package:audit

      - name: Package install smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run package:smoke

      - name: Install modes smoke
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run install:smoke

      - name: Package golden path
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run package:golden

      - name: Beta readiness
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm run beta:readiness

  rust:
    name: ZBoss Rust / Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup default 1.89.0

      - name: Build Migration Guard
        run: npm run build

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/zboss-rust/Cargo.toml

      - name: Unified Rust workspace gate
        run: npm run zboss-rust:gate
