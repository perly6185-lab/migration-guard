[package]
name = "zboss-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace]
resolver = "2"
members = [
  ".",
  "internal/dynamic-engine-runtime",
]
default-members = ["."]

[features]
default = ["memory"]
memory = ["zboss-dynamic-engine/memory"]
production = ["zboss-dynamic-engine/mysql", "zboss-dynamic-engine/redis"]

[dependencies]
axum = "=0.8.8"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.148"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
zboss-dynamic-engine = { package = "zboss-dynamic-engine-runtime", path = "internal/dynamic-engine-runtime", default-features = false }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }

[[bin]]
name = "zboss"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
