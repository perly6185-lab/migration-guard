services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: batch_delete
      MYSQL_USER: batch_delete
      MYSQL_PASSWORD: ${ZBOSS_TEST_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ZBOSS_TEST_MYSQL_ROOT_PASSWORD}
    ports:
      - "14306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4-alpine
    ports:
      - "17379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
