services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: batch_update
      MYSQL_USER: batch_update
      MYSQL_PASSWORD: batch_update
      MYSQL_ROOT_PASSWORD: local_root_only
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulocal_root_only"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
